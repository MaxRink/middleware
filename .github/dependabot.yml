version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: pip
    directories:
    - /src/middlewared
    - /src/middlewared/middlewared/plugins/apps/ix_apps
    - /src/middlewared/middlewared/pytest/unit
    - /src/middlewared_docs
    - /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
